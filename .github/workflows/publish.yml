name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 pytest-output.txt)
            echo "::error title=pytest-log-base64::$encoded"
          fi
          exit "$status"

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: arm64
            platform: linux/arm64
            dockerfile: Dockerfile
          - arch: armv7
            platform: linux/arm/v7
            dockerfile: Dockerfile.armv7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: w03zd8rc/awg-admin:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: AWG_ADMIN_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish latest
        run: >-
          docker buildx imagetools create
          --tag w03zd8rc/awg-admin:latest
          w03zd8rc/awg-admin:build-${{ github.sha }}-amd64
          w03zd8rc/awg-admin:build-${{ github.sha }}-arm64
          w03zd8rc/awg-admin:build-${{ github.sha }}-armv7
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: >-
          docker buildx imagetools create
          --tag w03zd8rc/awg-admin:${VERSION#v}
          w03zd8rc/awg-admin:build-${{ github.sha }}-amd64
          w03zd8rc/awg-admin:build-${{ github.sha }}-arm64
          w03zd8rc/awg-admin:build-${{ github.sha }}-armv7
