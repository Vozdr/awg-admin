name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: w03zd8rc/awg-admin
  GHCR_IMAGE: ghcr.io/vozdr/awg-admin

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: arm64
            platform: linux/arm64
            dockerfile: Dockerfile
          - arch: armv7
            platform: linux/arm/v7
            dockerfile: Dockerfile.armv7
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve application version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: AWG_ADMIN_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          dockerhub_images=()
          ghcr_images=()
          for digest in /tmp/digests/*; do
            hash="$(basename "$digest")"
            dockerhub_images+=("${DOCKERHUB_IMAGE}@sha256:${hash}")
            ghcr_images+=("${GHCR_IMAGE}@sha256:${hash}")
          done
          docker buildx imagetools create --tag "${DOCKERHUB_IMAGE}:latest" "${dockerhub_images[@]}"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:latest" "${ghcr_images[@]}"
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          dockerhub_images=()
          ghcr_images=()
          for digest in /tmp/digests/*; do
            hash="$(basename "$digest")"
            dockerhub_images+=("${DOCKERHUB_IMAGE}@sha256:${hash}")
            ghcr_images+=("${GHCR_IMAGE}@sha256:${hash}")
          done
          docker buildx imagetools create --tag "${DOCKERHUB_IMAGE}:${VERSION#v}" "${dockerhub_images[@]}"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:${VERSION#v}" "${ghcr_images[@]}"
